# Netlify configuration file

# Build settings
[build]
  publish = "dist"
  # Tests run before the build, so a failing test stops the deploy instead of
  # following it. The same suite runs in CI via .github/workflows/test.yml.
  command = "npm test && npm run build"

[functions]
  directory = "netlify/functions"

# This is a multi-page Astro site, not a SPA shell.
# Let Netlify serve the generated route files directly so each HTML page
# stays aligned with the hashed /_astro assets from the same deploy.

# Specific redirects
[[redirects]]
  from = "/updates"
  to = "/updates/1"
  status = 302

# Environment variables
[build.environment]
  NODE_VERSION = "22"
  # The build command runs `npm test` first, and vitest is a devDependency.
  # Netlify sets NODE_ENV=production, which makes npm omit devDependencies and
  # would make every deploy fail at the test step. This forces them in.
  NPM_FLAGS = "--production=false"

# Headers for security and CORS
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Apple App Site Association
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"
