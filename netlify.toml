# Netlify configuration file

# Build settings
[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

# This is a multi-page Astro site, not a SPA shell.
# Let Netlify serve the generated route files directly so each HTML page
# stays aligned with the hashed /_astro assets from the same deploy.

# Specific redirects
[[redirects]]
  from = "/updates"
  to = "/updates/1"
  status = 302

# Environment variables
[build.environment]
  NODE_VERSION = "20"

# Headers for security and CORS
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
