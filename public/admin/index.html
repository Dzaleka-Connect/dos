<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The editor is not public content and must never be indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Content editor | Dzaleka Online Services</title>
  </head>
  <body>
    <!--
      Sveltia CMS is a single-page app loaded from a CDN. It adds no build step,
      no dependency, and no adapter: the site stays `output: 'static'` and every
      page keeps prerendering. Removing this folder removes the CMS entirely.

      The version is pinned deliberately. Sveltia is pre-1.0 and ships several
      releases a week, so tracking @latest would change the editor under people
      mid-session. Bump this after reading the release notes.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.200.0/dist/sveltia-cms.js"></script>
  </body>
</html>
