# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.200.0/schema/sveltia-cms.json

# Sveltia CMS configuration for Dzaleka Online Services.
#
# Scope: the `news` collection only. Everything else stays developer-edited
# markdown. The encyclopedia in particular is deliberately excluded: every entry
# requires cited sources and a review date, and that record is worth keeping in
# pull requests where corrections are diffable.
#
# IMPORTANT: the fields below must stay in step with `newsSchema` in
# src/content.config.ts. Astro validates frontmatter with Zod at build time, so
# a field that drifts here does not fail in the editor, it fails the next build
# after someone publishes. tests/cms-config.test.ts asserts the two agree.

backend:
  name: github
  repo: Dzaleka-Connect/dos
  branch: main
  # Commits made through the editor are attributed to the signed-in GitHub user.
  commit_messages:
    create: 'news: add {{collection}} entry "{{slug}}"'
    update: 'news: update {{collection}} entry "{{slug}}"'
    delete: 'news: remove {{collection}} entry "{{slug}}"'
    uploadMedia: 'media: upload {{path}}'
    deleteMedia: 'media: remove {{path}}'

# Where uploads are written in the repo, and the URL they resolve to.
# Existing articles reference images as `/images/...`, so these must match.
media_folder: public/images
public_folder: /images

collections:
  - name: news
    label: News and updates
    label_singular: News article
    description: >-
      Articles published to /news. Publishing commits a Markdown file to the
      repository, which triggers a rebuild; the article appears once the deploy
      finishes.
    folder: src/content/news
    create: true
    # Defaults, stated explicitly so a Sveltia default change cannot silently
    # alter the on-disk format the existing 30 articles use.
    format: yaml-frontmatter
    extension: md
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: [date, title, category]
    view_groups:
      - label: Category
        field: category
    fields:
      - name: title
        label: Title
        widget: string
        required: true

      - name: description
        label: Summary
        widget: text
        required: true
        hint: One or two sentences. Shown on the news index and in search results.

      - name: date
        label: Publication date
        widget: datetime
        required: true
        type: date
        # Date-only, fixed to UTC. Without this the stored date can shift a day
        # depending on the editor's timezone.
        picker_utc: true
        default: '{{now}}'

      - name: updated
        label: Last updated
        widget: datetime
        required: false
        type: date
        picker_utc: true
        hint: Only set this if the article changed materially after publication.

      # Must match the z.enum in newsSchema exactly. An unlisted value fails the build.
      - name: category
        label: Category
        widget: select
        required: true
        options:
          - { label: Announcement, value: announcement }
          - { label: News, value: news }
          - { label: Success story, value: success-story }
          - { label: Business spotlight, value: business-spotlight }
          - { label: Business guide, value: business-guide }
          - { label: Education, value: education }

      - name: featured
        label: Feature this article
        widget: boolean
        required: false
        default: false
        hint: Featured articles are promoted on the news index.

      - name: image
        label: Cover image
        widget: image
        required: false

      - name: author
        label: Author
        widget: string
        required: false
        default: Dzaleka Online Services

      - name: tags
        label: Tags
        widget: list
        required: false
        hint: Used to relate this article to encyclopedia entries.

      - name: businessName
        label: Business name
        widget: string
        required: false
        hint: Business spotlights only.

      - name: businessOwner
        label: Business owner
        widget: string
        required: false
        hint: Business spotlights only.

      - name: contactInfo
        label: Contact details
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: email, label: Email, widget: string, required: false }
          - { name: phone, label: Phone, widget: string, required: false }
          - { name: website, label: Website, widget: string, required: false }

      # Not part of newsSchema: this is the Markdown body below the frontmatter.
      - name: body
        label: Article
        widget: markdown
        required: true

  - name: events
    label: Events
    label_singular: Event
    description: >-
      Community events listed at /events. Set the status to "past" once an event
      has taken place so it moves out of the upcoming list.
    folder: src/content/events
    create: true
    format: yaml-frontmatter
    extension: md
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: [date, title, status]
    view_groups:
      - label: Status
        field: status
    fields:
      - name: title
        label: Title
        widget: string
        required: true

      - name: description
        label: Summary
        widget: text
        required: true

      - name: date
        label: Date
        widget: datetime
        required: true
        type: date
        picker_utc: true

      - name: endDate
        label: End date
        widget: datetime
        required: false
        type: date
        picker_utc: true
        hint: Only for events running across more than one day.

      - name: location
        label: Location
        widget: string
        required: true

      # Free text in the schema, so no fixed option list. Existing values include
      # Festival, Live Performance, Workshop, Webinar and Zoom Meeting.
      - name: category
        label: Category
        widget: string
        required: true

      - name: organizer
        label: Organiser
        widget: string
        required: true

      - name: status
        label: Status
        widget: select
        required: false
        default: upcoming
        options:
          - { label: Upcoming, value: upcoming }
          - { label: Past, value: past }

      - name: featured
        label: Feature this event
        widget: boolean
        required: false
        default: false

      - name: image
        label: Image
        widget: image
        required: false

      - name: contact
        label: Contact details
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: email, label: Email, widget: string, required: false }
          - { name: phone, label: Phone, widget: string, required: false }
          - { name: whatsapp, label: WhatsApp, widget: string, required: false }

      - name: registration
        label: Registration
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: required, label: Registration required, widget: boolean, required: true, default: false }
          - { name: url, label: Registration link, widget: string, required: false }
          - name: deadline
            label: Registration deadline
            widget: datetime
            required: false
            type: date
            picker_utc: true

      - name: panelists
        label: Speakers and panellists
        widget: list
        required: false
        collapsed: true
        summary: '{{fields.name}}'
        fields:
          - { name: name, label: Name, widget: string, required: true }
          - { name: role, label: Role, widget: string, required: false }
          - { name: bio, label: Biography, widget: text, required: false }
          - { name: image, label: Photo, widget: image, required: false }
          - { name: organization, label: Organisation, widget: string, required: false }
          - name: socialMedia
            label: Social media
            widget: object
            required: false
            collapsed: true
            fields:
              - { name: twitter, label: Twitter, widget: string, required: false }
              - { name: instagram, label: Instagram, widget: string, required: false }
              - { name: linkedin, label: LinkedIn, widget: string, required: false }
              - { name: website, label: Website, widget: string, required: false }

      - name: tags
        label: Tags
        widget: list
        required: false

      - name: body
        label: Details
        widget: markdown
        required: false

  - name: jobs
    label: Jobs
    label_singular: Job
    description: >-
      Opportunities listed at /jobs. Set the status to "closed" once a role is
      filled or its deadline has passed.
    folder: src/content/jobs
    create: true
    format: yaml-frontmatter
    extension: md
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} - {{organization}}'
    sortable_fields: [posted, deadline, title, status]
    view_groups:
      - label: Status
        field: status
    fields:
      - name: title
        label: Job title
        widget: string
        required: true

      - name: organization
        label: Organisation
        widget: string
        required: true

      - name: location
        label: Location
        widget: string
        required: true

      - name: type
        label: Employment type
        widget: select
        required: true
        options:
          - { label: Full time, value: full-time }
          - { label: Part time, value: part-time }
          - { label: Contract, value: contract }
          - { label: Volunteer, value: volunteer }
          - { label: Internship, value: internship }

      - name: category
        label: Category
        widget: select
        required: true
        options:
          - { label: Education, value: education }
          - { label: Healthcare, value: healthcare }
          - { label: Technology, value: technology }
          - { label: Community, value: community }
          - { label: Business, value: business }
          - { label: Arts, value: arts }
          - { label: Services, value: services }
          - { label: Other, value: other }

      - name: posted
        label: Date posted
        widget: datetime
        required: true
        type: date
        picker_utc: true
        default: '{{now}}'

      - name: deadline
        label: Application deadline
        widget: datetime
        required: false
        type: date
        picker_utc: true

      - name: status
        label: Status
        widget: select
        required: false
        default: open
        options:
          - { label: Open, value: open }
          - { label: Closed, value: closed }
          - { label: Draft, value: draft }

      - name: featured
        label: Feature this job
        widget: boolean
        required: false
        default: false

      - name: salary
        label: Salary or stipend
        widget: string
        required: false

      - name: skills
        label: Skills
        widget: list
        required: true
        hint: At least one skill. The schema requires this field.

      # Required in the schema, and email is validated, so a blank or malformed
      # address fails the build.
      - name: contact
        label: How to apply
        widget: object
        required: true
        fields:
          - name: email
            label: Email
            widget: string
            required: true
            pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a valid email address']
          - { name: phone, label: Phone, widget: string, required: false }
          - { name: website, label: Website, widget: string, required: false }

      - name: description
        label: Summary
        widget: text
        required: true
        hint: Shown on the jobs index. The full description goes in the field below.

      - name: body
        label: Full description
        widget: markdown
        required: false

  - name: photos
    label: Photo archive
    label_singular: Photo
    description: >-
      Photographs published at /photos. Images may be uploaded or referenced by
      URL: over half the archive credits external sources such as WFP.
    folder: src/content/photos
    create: true
    format: yaml-frontmatter
    extension: md
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: [date, title]
    fields:
      - name: title
        label: Title
        widget: string
        required: true

      - name: description
        label: Caption
        widget: text
        required: true

      - name: date
        label: Date taken
        widget: datetime
        required: true
        type: date
        picker_utc: true

      # The schema accepts either a path under /images/ or an absolute URL, so
      # uploading and linking are both valid.
      - name: image
        label: Photograph
        widget: image
        required: true
        choose_url: true

      # Required in the schema, and `name` within it is required too.
      - name: photographer
        label: Photographer
        widget: object
        required: true
        fields:
          - { name: name, label: Name, widget: string, required: true }
          - { name: bio, label: Biography, widget: text, required: false }
          - { name: instagram, label: Instagram handle, widget: string, required: false }
          - { name: website, label: Website, widget: string, required: false }

      - name: contributor
        label: Contributor
        widget: string
        required: false
        hint: The person who submitted this photo, if different from the photographer.

      - name: location
        label: Location
        widget: string
        required: false

      - name: featured
        label: Feature this photo
        widget: boolean
        required: false
        default: false

      - name: tags
        label: Tags
        widget: list
        required: false

      - name: gallery
        label: Additional images
        widget: list
        required: false
        field: { name: url, label: Image, widget: image, choose_url: true }

      - name: body
        label: About this photo
        widget: markdown
        required: false

  - name: community-voices
    label: Community voices
    label_singular: Community voice
    description: >-
      First-person stories published at /community-voice. Submissions arriving
      through the site form can be drafted here and published once reviewed.
    folder: src/content/community-voices
    create: true
    format: yaml-frontmatter
    extension: md
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} - {{author}}'
    sortable_fields: [date, title, author]
    fields:
      - name: title
        label: Title
        widget: string
        required: true

      - name: author
        label: Author
        widget: string
        required: true
        hint: The name the contributor wishes to be credited under.

      - name: date
        label: Date
        widget: datetime
        required: true
        type: date
        picker_utc: true

      # Free text in the schema. Existing entries use "Stories".
      - name: category
        label: Category
        widget: string
        required: true
        default: Stories

      - name: excerpt
        label: Pull quote
        widget: text
        required: true
        hint: A short extract shown on the index. Often the story's opening line.

      - name: image
        label: Image
        widget: image
        required: false
        choose_url: true

      - name: featured
        label: Feature this story
        widget: boolean
        required: false
        default: false

      - name: tags
        label: Tags
        widget: list
        required: false

      - name: body
        label: Story
        widget: markdown
        required: true
